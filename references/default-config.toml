[workspace]
database = "../runtime/papers.sqlite"
pdf_dir = "../site/pdfs"
site_dir = "../site"
staging_dir = "../runtime/staging"
download_pdfs = false
workflow_mode = "abstract-only"
since_days = 14
timeout_seconds = 25
max_items_per_source = 30
user_agent = "HermesPaperMonitor/0.1 (+local automation)"

[keywords]
terms = [
  "visual inertial",
  "vehicle",
  "state estimation",
  "location",
  "inertial",
  "odometry",
  "navigation",
  "ins",
  "gnss",
  "gps",
  "5g",
  "slam",
  "geomagnetic",
  "gpr",
]
categories = ["cs.RO", "cs.AI", "cs.HC", "cs.MA"]

# The default profile is abstract-only:
# monitor new papers, collect title/abstract metadata, update SQLite, rebuild the site.
# Add cookie_file or auth headers and switch workflow_mode to "full" only if you want
# restricted PDF downloads plus post-discovery enrichment.

[llm_translation]
enabled = true
api_endpoint = "https://api.edgefn.net/v1"
model = "DeepSeek-R1-0528-Qwen3-8B"
api_key_env = "sk-ELoPUl7jAFQesEzV7b97220b01E246C480Fb3637CdC2F361"
temperature = 0.2
# Keep this modest for reasoning-capable models. Oversized limits can trigger provider-side 400s
# before the model returns the translated summary.
max_output_tokens = 1024
title_max_output_tokens = 512
only_translate_english = true
# system_prompt = "Override the default academic translation prompt if needed."
# title_system_prompt = "Override the default title translation prompt if needed."
# headers = { }
# extra_body = { }

[service]
host = "127.0.0.1"
port = 8765
refresh_interval_minutes = 0
daily_refresh_times = ["06:00", "18:00"]
initial_refresh = true


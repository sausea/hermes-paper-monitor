[workspace]
database = "../runtime/papers.sqlite"
pdf_dir = "../site/pdfs"
site_dir = "../site"
staging_dir = "../runtime/staging"
download_pdfs = false
workflow_mode = "abstract-only"
since_days = 14
timeout_seconds = 25
max_items_per_source = 40
user_agent = "HermesPaperMonitor/0.1 (+local automation)"

[keywords]
terms = [
  "visual inertial",
  "vehicle",
  "state estimation",
  "location",
  "inertial",
  "odometry",
  "navigation",
  "ins",
  "gnss",
  "gps",
  "5g",
  "slam",
  "geomagnetic",
  "gpr",
]
categories = ["cs.RO", "cs.AI", "cs.HC", "cs.MA"]

[[sources]]
id = "ieee-41"
label = "IEEE Transactions on Industrial Electronics"
kind = "crossref-journal"
url = "https://ieeexplore.ieee.org/xpl/RecentIssue.jsp?punumber=41"
journal_issn = "0278-0046"
publisher = "IEEE"
collection = "IEEE Transactions on Industrial Electronics"
requires_cookies = false
pdf_policy = "restricted"
follow_article_pages = false
max_items = 30


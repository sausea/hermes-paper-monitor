  "state estimation",
  "location",
  "inertial",
  "odometry",
  "navigation",
  "ins",
  "gnss",
  "gps",
  "5g",
  "slam",
  "geomagnetic",
  "gpr",
]
categories = ["cs.RO", "cs.AI", "cs.HC", "cs.MA"]

[[sources]]
